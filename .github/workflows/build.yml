name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 2.0.1)'
        required: false
        default: ''

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================
  # 1. 代码质量检查
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff

      - name: Run Ruff linter
        run: python -m ruff check scanner_toolbox scanner_webview.py scanner_gui.py

      - name: Run Ruff format check
        run: python -m ruff format --check scanner_toolbox scanner_webview.py scanner_gui.py

  # ============================================================
  # 2. 构建三个版本的 Windows EXE
  # ============================================================
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - name: webview
            display: "超级骆狗工具箱"
            script: scanner_webview.py
            windowed: true
            extra_args: >-
              --add-data "preview.html;."
              --hidden-import webview.platforms.edgechromium
              --hidden-import webview.platforms.mshtml
              --hidden-import webview.platforms.winforms
          - name: gui
            display: "超级骆狗工具箱-GUI"
            script: scanner_gui.py
            windowed: true
            extra_args: >-
              --collect-data customtkinter
          - name: console
            display: "超级骆狗工具箱-命令行"
            script: scanner_toolbox/main.py
            windowed: false
            extra_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" Pillow

      - name: Generate app icon (skip if custom icon exists)
        run: python generate_icon.py

      - name: Update version info
        if: github.event.inputs.version != ''
        shell: python
        run: |
          import re
          version = "${{ github.event.inputs.version }}"
          ver_tuple = tuple(int(x) for x in version.split('.')) + (0,)
          with open('version_info.py', 'r', encoding='utf-8') as f:
            content = f.read()
          content = re.sub(r'filevers=\([^)]+\)', f'filevers={ver_tuple}', content)
          content = re.sub(r'prodvers=\([^)]+\)', f'prodvers={ver_tuple}', content)
          content = re.sub(r"FileVersion', u'[^']+'", f"FileVersion', u'{version}.0'", content)
          content = re.sub(r"ProductVersion', u'[^']+'", f"ProductVersion', u'{version}.0'", content)
          with open('version_info.py', 'w', encoding='utf-8') as f:
            f.write(content)

      - name: Build ${{ matrix.target.display }}
        run: |
          $windowed = "${{ matrix.target.windowed }}"
          $args = @(
            "--onefile"
            "--name", "${{ matrix.target.display }}"
            "--version-file", "version_info.py"
            "--manifest", "app.manifest"
            "--uac-admin"
            "--icon=icon.ico"
            "--hidden-import", "scanner_toolbox"
            "--hidden-import", "scanner_toolbox.config"
            "--hidden-import", "scanner_toolbox.config.constants"
            "--hidden-import", "scanner_toolbox.config.malware_db"
            "--hidden-import", "scanner_toolbox.core"
            "--hidden-import", "scanner_toolbox.core.scanner"
            "--hidden-import", "scanner_toolbox.core.cleaner"
            "--hidden-import", "scanner_toolbox.core.report"
            "--hidden-import", "scanner_toolbox.modules"
            "--hidden-import", "scanner_toolbox.modules.cache_clean"
            "--hidden-import", "scanner_toolbox.modules.anti_hijack"
            "--hidden-import", "scanner_toolbox.modules.space_manager"
            "--hidden-import", "scanner_toolbox.modules.security_audit"
            "--hidden-import", "scanner_toolbox.modules.network_tools"
            "--hidden-import", "scanner_toolbox.modules.sysinfo"
            "--hidden-import", "scanner_toolbox.modules.install_helper"
            "--hidden-import", "scanner_toolbox.modules.perf_optimizer"
            "--hidden-import", "scanner_toolbox.utils"
            "--hidden-import", "scanner_toolbox.utils.terminal"
            "--hidden-import", "scanner_toolbox.utils.file_ops"
            "--clean"
          )
          if ($windowed -eq "true") {
            $args += "--windowed"
          }
          if ("${{ matrix.target.extra_args }}" -ne "") {
            $extra = "${{ matrix.target.extra_args }}" -split '\s+'
            $args += $extra
          }
          $args += "${{ matrix.target.script }}"
          pyinstaller @args

      - name: Copy EXE to root for flat artifact
        run: copy "dist\${{ matrix.target.display }}.exe" .

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: ${{ matrix.target.display }}.exe
          retention-days: 90

  # ============================================================
  # 3. 打包安装程序（Inno Setup）
  # ============================================================
  pack_installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all EXE artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify EXE files
        run: |
          echo "=== Downloaded EXEs ==="
          dir dist /s /b
          if not exist "dist\超级骆狗工具箱.exe" exit /b 1

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Update installer version
        if: github.event.inputs.version != ''
        shell: python
        run: |
          import re
          version = "${{ github.event.inputs.version }}"
          with open('installer.iss', 'r', encoding='utf-8') as f:
            content = f.read()
          content = re.sub(r'#define AppVersion\s+".*"', f'#define AppVersion    "{version}"', content)
          content = re.sub(r'Setup-v[\d.]+', f'Setup-v{version}', content)
          with open('installer.iss', 'w', encoding='utf-8') as f:
            f.write(content)

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          dir installer_output\

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer_output/超级骆狗工具箱-Setup-*.exe
          retention-days: 90

  # ============================================================
  # 4. 发布 Release（仅 tag 触发或手动输入版本号）
  # ============================================================
  release:
    needs: [build, pack_installer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Prepare release files
        run: |
          mkdir -p release
          # Copy all EXEs and installer
          find dist -name "*.exe" -exec cp {} release/ \;
          ls -lh release/

      - name: Set version env
        run: echo "REL_VERSION=${{ github.event.inputs.version || github.ref_name }}" >> $GITHUB_ENV

      - name: Generate release notes
        run: |
          cat > release_notes.md << ENDOFFILE
          ## 超级骆狗工具箱 ${{ env.REL_VERSION }}

          一个集系统扫描、垃圾清理、防劫持、安全审计于一体的 Windows 工具箱。

          ### 下载推荐
          | 文件 | 说明 |
          |------|------|
          | **超级骆狗工具箱-Setup.exe** | 安装程序（推荐）— 自动安装到开始菜单和桌面 |
          | 超级骆狗工具箱.exe | Web UI 版 — 绿色便携版，无需安装 |

          ### 其他构建
          | 文件 | 说明 |
          |------|------|
          | 超级骆狗工具箱-GUI.exe | CustomTkinter 桌面版 |
          | 超级骆狗工具箱-命令行.exe | 命令行版 |

          ### 安装说明
          1. 下载 **超级骆狗工具箱-Setup.exe**
          2. 双击运行，按向导完成安装
          3. 首次启动 Windows Defender 可能误报，点击「更多信息」→「仍要运行」

          ### 系统要求
          - Windows 10/11 (64位)
          - 需要管理员权限

          ### 注意事项
          - 建议购买代码签名证书以消除 SmartScreen 警告
          - 本工具仅支持 Windows 系统
          ENDOFFILE

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: 超级骆狗工具箱 ${{ env.REL_VERSION }}
          body_path: release_notes.md
          files: release/*.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.event.inputs.version, 'beta') || contains(github.event.inputs.version, 'alpha') }}
