name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 2.0.1)'
        required: false
        default: ''

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================
  # 1. 构建三个版本的 Windows EXE
  # ============================================================
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - name: webview
            display: "超级骆狗工具箱"
            script: scanner_webview.py
            windowed: true
          - name: gui
            display: "超级骆狗工具箱-GUI"
            script: scanner_gui.py
            windowed: true
          - name: console
            display: "超级骆狗工具箱-命令行"
            script: scanner_toolbox/main.py
            windowed: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller pillow
          if ("${{ matrix.target.name }}" -eq "webview") { pip install pywebview }
          if ("${{ matrix.target.name }}" -eq "gui") { pip install customtkinter }

      - name: Build EXE
        shell: pwsh
        run: |
          $target = "${{ matrix.target.name }}"
          $args = @(
            "--onefile"
            "--name", "${{ matrix.target.display }}"
            "--version-file", "version_info.py"
            "--manifest", "app.manifest"
            "--uac-admin"
            "--icon=icon.ico"
            "--hidden-import", "scanner_toolbox"
            "--hidden-import", "scanner_toolbox.config"
            "--hidden-import", "scanner_toolbox.config.constants"
            "--hidden-import", "scanner_toolbox.config.malware_db"
            "--hidden-import", "scanner_toolbox.core"
            "--hidden-import", "scanner_toolbox.core.scanner"
            "--hidden-import", "scanner_toolbox.core.cleaner"
            "--hidden-import", "scanner_toolbox.core.report"
            "--hidden-import", "scanner_toolbox.modules"
            "--hidden-import", "scanner_toolbox.modules.cache_clean"
            "--hidden-import", "scanner_toolbox.modules.anti_hijack"
            "--hidden-import", "scanner_toolbox.modules.space_manager"
            "--hidden-import", "scanner_toolbox.modules.security_audit"
            "--hidden-import", "scanner_toolbox.modules.network_tools"
            "--hidden-import", "scanner_toolbox.modules.sysinfo"
            "--hidden-import", "scanner_toolbox.modules.install_helper"
            "--hidden-import", "scanner_toolbox.modules.perf_optimizer"
            "--hidden-import", "scanner_toolbox.utils"
            "--hidden-import", "scanner_toolbox.utils.terminal"
            "--hidden-import", "scanner_toolbox.utils.file_ops"
            "--clean"
          )
          if ("${{ matrix.target.windowed }}" -eq "true") { $args += "--windowed" }

          # Target-specific extras
          if ($target -eq "webview") {
            $args += "--add-data=preview.html;."
            $args += "--hidden-import=webview.platforms.edgechromium"
            $args += "--hidden-import=webview.platforms.mshtml"
            $args += "--hidden-import=webview.platforms.winforms"
          }
          elseif ($target -eq "gui") {
            $args += "--collect-data=customtkinter"
          }

          $args += "${{ matrix.target.script }}"
          pyinstaller @args

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: dist/${{ matrix.target.display }}.exe

  # ============================================================
  # 2. 打包安装程序（Inno Setup）
  # ============================================================
  pack_installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify EXEs
        run: |
          ls dist/
          if (-not (Test-Path "dist/超级骆狗工具箱.exe")) { exit 1 }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          ls installer_output/

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer_output/超级骆狗工具箱-Setup-*.exe

  # ============================================================
  # 3. 发布 Release
  # ============================================================
  release:
    needs: pack_installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Collect files
        run: |
          mkdir -p release
          find dist -name "*.exe" -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 超级骆狗工具箱 ${{ github.ref_name }}
          body: |
            ## 超级骆狗工具箱 ${{ github.ref_name }}

            集系统扫描、垃圾清理、防劫持、安全审计于一体的 Windows 工具箱。

            ### 推荐下载

            | 文件 | 说明 |
            |------|------|
            | **超级骆狗工具箱-Setup-*.exe** | 安装程序 — 自动装到开始菜单和桌面 |
            | 超级骆狗工具箱.exe | Web UI 版 — 绿色便携版，无需安装 |

            ### 其他版本

            | 文件 | 说明 |
            |------|------|
            | 超级骆狗工具箱-GUI.exe | CustomTkinter 桌面版 |
            | 超级骆狗工具箱-命令行.exe | 命令行版 |

            ### 使用说明

            1. 下载 **安装程序** 或 **绿色版** EXE 文件
            2. 右键「以管理员身份运行」
            3. 首次运行 SmartScreen 可能误报，点「更多信息」→「仍要运行」

            ### 系统要求
            - Windows 10/11 (64位)
            - 需要管理员权限
          files: release/*.exe
          draft: false
          prerelease: false
